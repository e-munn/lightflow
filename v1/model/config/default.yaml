audio:
  sample_rate: 22050
  hop_length: 512
  n_fft: 2048
  n_mels: 128
  window_seconds: 0.5
  hop_seconds: 0.05
features:
  mel_spectrogram: true
  onset_strength: true
  chroma: true
  rms_energy: true
  spectral_centroid: true
model:
  type: temporal_cnn
  input_channels: 143
  hidden_dim: 128
  num_layers: 4
  dropout: 0.15
  output_dim: 6
stem_channels:
- bass_energy
- kick_energy
- snare_energy
- hat_energy
- vocals_energy
- other_energy
training:
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  epochs: 40
  scheduler: cosine
  warmup_epochs: 5
  grad_clip: 1.0
data:
  train_split: 0.75
  val_split: 0.125
  test_split: 0.125
  augment:
    gain_jitter:
    - 0.8
    - 1.2
    noise_level: 0.01
